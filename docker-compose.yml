services:
  comigo:
    build: .
    container_name: comigo_app
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo

  mcp:
    build: .
    container_name: comigo_mcp
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: fastmcp run mcp_server.py --transport sse --host 0.0.0.0 --port 8000
    environment:
      - TZ=America/Sao_Paulo
