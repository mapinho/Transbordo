{% extends "base.html" %}
{% load i18n %}
{% block title %}Recuperar senha — Transbordo{% endblock %}
{% block content %}
  <c-card class="mx-auto mt-16 max-w-sm">
    <h1 class="mb-2 text-lg font-semibold text-base-content">Recuperar senha</h1>
    <p class="mb-4 text-sm text-base-content/70">
      Informe o e-mail da sua conta e enviaremos um link para redefinir a senha.
    </p>
    <form method="post" action="{% url 'account_reset_password' %}" class="space-y-3">
      {% csrf_token %}
      {{ form.as_div }}
      {{ redirect_field }}
      <button type="submit" class="btn btn-primary w-full">Enviar link</button>
    </form>
  </c-card>
{% endblock %}
