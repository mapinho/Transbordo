{% extends "base.html" %}
{% load i18n %}
{% block title %}Trocar senha — Transbordo{% endblock %}
{% block content %}
  <c-card class="mx-auto mt-16 max-w-sm">
    <h1 class="mb-4 text-lg font-semibold text-base-content">Trocar senha</h1>
    <form method="post" action="{% url 'account_change_password' %}" class="space-y-3">
      {% csrf_token %}
      {{ redirect_field }}
      {{ form.as_div }}
      <button type="submit" class="btn btn-primary w-full">Trocar senha</button>
    </form>
  </c-card>
{% endblock %}
