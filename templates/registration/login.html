{% extends "base.html" %}
{% block content %}
<div class="max-w-sm mx-auto mt-16">
    <c-card>
        <h1 class="text-lg font-semibold mb-4">Entrar</h1>
        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
            <p class="text-red-600 text-sm mb-3">Usuário ou senha inválidos.</p>
            {% endif %}
            <div class="mb-3">
                <label for="{{ form.username.id_for_label }}" class="block text-sm mb-1">Usuário</label>
                {{ form.username }}
            </div>
            <div class="mb-4">
                <label for="{{ form.password.id_for_label }}" class="block text-sm mb-1">Senha</label>
                {{ form.password }}
            </div>
            <button type="submit" class="w-full rounded bg-[var(--cor-primaria)] hover:bg-[var(--cor-primaria-hover)] text-white py-2">
                Entrar
            </button>
        </form>
    </c-card>
</div>
{% endblock %}
