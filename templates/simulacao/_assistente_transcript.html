<div class="space-y-2">
    {% for m in conversa.mensagens %}
    <div class="chat {% if m.papel == 'user' %}chat-end{% else %}chat-start{% endif %}">
        <div class="chat-bubble {% if m.papel == 'user' %}chat-bubble-primary{% endif %}">{{ m.conteudo|linebreaksbr }}</div>
    </div>
    {% empty %}
    <p class="text-base-content/50 text-sm">Nenhuma mensagem ainda.</p>
    {% endfor %}
</div>
