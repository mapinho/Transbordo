{% extends "gestao/base_gestao.html" %}
{% block title %}{{ titulo }} — Transbordo{% endblock %}
{% block gestao_content %}
  <h1 class="text-lg font-semibold text-[var(--cor-primaria)] mb-4">{{ titulo }}</h1>
  <form method="post" class="space-y-3 max-w-md">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a href="{% url 'gestao:usuarios' %}" class="btn">Cancelar</a>
  </form>
  {% if form.instance.pk and pode_enviar_link %}
    <form method="post" action="{% url 'gestao:usuario_enviar_link' form.instance.pk %}" class="mt-4">
      {% csrf_token %}
      <button type="submit" class="btn btn-sm">Enviar link de definição de senha</button>
    </form>
  {% endif %}
{% endblock %}
