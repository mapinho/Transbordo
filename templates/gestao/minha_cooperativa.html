{% extends "gestao/base_gestao.html" %}
{% block title %}Minha cooperativa — Transbordo{% endblock %}
{% block gestao_content %}
  <h1 class="text-lg font-semibold text-[var(--cor-primaria)] mb-4">{{ cooperativa.nome }}</h1>
  <form method="post" class="space-y-3 max-w-md">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Salvar</button>
  </form>
{% endblock %}
