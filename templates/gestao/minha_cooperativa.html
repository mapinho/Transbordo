{% extends "gestao/base_gestao.html" %}
{% load crispy_forms_tags %}
{% block title %}Minha organização — Transbordo{% endblock %}
{% block gestao_breadcrumb %}<c-breadcrumb><span class="text-base-content/60">Minha organização</span></c-breadcrumb>{% endblock %}
{% block gestao_content %}
  <h1 class="text-lg font-semibold text-base-content mb-4">{{ cooperativa.nome }}</h1>
  <c-card class="max-w-xl">
    <form method="post">
      {% csrf_token %}
      {% crispy form %}
      <div class="mt-4 flex gap-2">
        <button type="submit" class="btn btn-primary btn-sm">Salvar</button>
      </div>
    </form>
  </c-card>
{% endblock %}
